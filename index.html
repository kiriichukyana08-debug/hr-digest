const LIVE = "./";
let LOCAL = null;          // {version, feed_tpl, admin_html, feed?, admin?, decisions?}
let META = null;           // свежая версия в интернете
let CUR = {};              // что сейчас показано: {feed, admin, decisions}
const cache = {};          // загрузки из интернета (промисы)

async function gunzipJson(bytes) {
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(stream).text());
}

async function fetchBytes(url, timeoutMs, onProgress) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), timeoutMs);
  try {
    const r = await fetch(url + (url.includes("?") ? "&" : "?") + "t=" + Date.now(), { cache: "no-store", signal: ctl.signal });
    if (!r.ok) return null;
    const total = +r.headers.get("content-length") || 0;
    if (!r.body || !onProgress) return new Uint8Array(await r.arrayBuffer());
    const reader = r.body.getReader(), parts = [];
    let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      parts.push(value); got += value.length;
      if (total) onProgress(Math.min(99, Math.round(100 * got / total)));
    }
    const out = new Uint8Array(got);
    let pos = 0;
    for (const p of parts) { out.set(p, pos); pos += p.length; }
    return out;
  } catch (e) { return null; } finally { clearTimeout(timer); }
}

function live(name, timeoutMs, onProgress) {
  if (!cache[name]) cache[name] = fetchBytes(LIVE + name, timeoutMs, onProgress).then(b => b ? gunzipJson(b) : null).catch(() => null);
  return cache[name];
}

const fmt = (iso) => new Date(iso).toLocaleString("ru-RU", { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });
function note(html, ms) {
  const n = document.getElementById("note");
  n.innerHTML = html + ' <button class="x" title="Закрыть">✕</button>';
  n.style.display = "flex";
  n.querySelector(".x").onclick = () => { n.style.display = "none"; };
  if (ms) setTimeout(() => { n.style.display = "none"; }, ms);
}
const hideNote = () => { document.getElementById("note").style.display = "none"; };
const OFFLINE = (v) => "Показана сохранённая версия от " + fmt(v) + ". Свежую загрузить не удалось — нет интернета или сайт обновлений закрыт в вашей сети.";

function feedDoc(data) {
  const js = JSON.stringify(data).replace(/</g, "\\u003c");
  return LOCAL.feed_tpl.replace("/*__DATA__*/null", () => js);
}
function currentView() { return location.hash === "#admin" ? "admin" : "feed"; }
function show(view) {
  const f = document.getElementById("v-" + view);
  if (!f.getAttribute("srcdoc")) f.srcdoc = view === "feed" ? feedDoc(CUR.feed) : LOCAL.admin_html;
  document.querySelectorAll("iframe").forEach(x => x.classList.toggle("on", x === f));
  document.getElementById("ld").style.display = "none";
  document.title = view === "admin" ? "HR-дайджест · Сбор" : "HR-дайджест";
  try { history.replaceState(null, "", "#" + view); } catch (e) { /* file:// */ }
}
function reload(view) { const f = document.getElementById("v-" + view); f.removeAttribute("srcdoc"); if (f.classList.contains("on")) show(view); }

const liveNewer = () => !!META && (!LOCAL.version || META.version > LOCAL.version);

// Данные «Сбора» и журнал решений — по запросу страницы «Сбора»
async function adminData() {
  if (CUR.admin) return CUR.admin;
  if (liveNewer()) {
    const a = await live("admin.json.gz", 60000);
    if (a) return (CUR.admin = a);
  }
  if (LOCAL.admin) return (CUR.admin = LOCAL.admin);
  throw new Error("нет данных");
}
async function decisionsData() {
  if (CUR.decisions) return CUR.decisions;
  if (liveNewer()) {
    note("Загружаю журнал решений… 0%");
    const d = await live("decisions.json.gz", 300000, (p) => note("Загружаю журнал решений… " + p + "%"));
    hideNote();
    if (d) return (CUR.decisions = d);
    if (LOCAL.decisions) note(OFFLINE(LOCAL.version), 10000);
  }
  if (LOCAL.decisions) return (CUR.decisions = LOCAL.decisions);
  throw new Error("нет данных");
}

addEventListener("message", async (e) => {
  const own = [...document.querySelectorAll("iframe")].some(f => f.contentWindow === e.source);
  if (!own || !e.data) return;
  if (e.data.hrd === "feed" || e.data.hrd === "admin") show(e.data.hrd);
  try {
    if (e.data.hrd === "need-data") e.source.postMessage({ hrd: "data", snapshot: await adminData() }, "*");
    if (e.data.hrd === "need-decisions") e.source.postMessage({ hrd: "decisions", decisions: await decisionsData() }, "*");
  } catch (err) {
    note("Не удалось загрузить данные: нет связи с сайтом обновлений.");
  }
});

(async () => {
  try {
    LOCAL = await gunzipJson(Uint8Array.from(atob(PACK), c => c.charCodeAt(0)));
    if (LIVE) {
      const m = await fetchBytes(LIVE + "meta.json", 15000);
      try { META = m ? JSON.parse(new TextDecoder().decode(m)) : null; } catch (e) { META = null; }
    }
    if (!liveNewer()) {
      if (!LOCAL.feed) throw new Error("нет данных");
      CUR.feed = LOCAL.feed;
      show(currentView());
      if (LIVE && !META) note(OFFLINE(LOCAL.version), 12000);
      return;
    }
    // В интернете есть версия новее встроенной
    const feedPromise = live("feed.json.gz", 180000, (p) => { if (CUR.feed) note("Загружаю свежую ленту от " + fmt(META.version) + "… " + p + "%"); });
    if (!LOCAL.feed) {  // страница на сайте — встроенных данных нет
      document.getElementById("ld").textContent = "Загружаю ленту…";
      CUR.feed = await feedPromise;
      if (!CUR.feed) throw new Error("нет связи");
      show(currentView());
      return;
    }
    const quick = await Promise.race([feedPromise, new Promise(r => setTimeout(() => r("wait"), 3000))]);
    if (quick && quick !== "wait") {
      CUR.feed = quick; show(currentView());
      note("Лента обновлена: данные от " + fmt(META.version), 5000);
      return;
    }
    CUR.feed = LOCAL.feed; show(currentView());
    if (!quick) { note(OFFLINE(LOCAL.version), 12000); return; }
    note("Загружаю свежую ленту от " + fmt(META.version) + "…");
    const fresh = await feedPromise;
    if (!fresh) { note(OFFLINE(LOCAL.version), 12000); return; }
    note("Свежая лента от " + fmt(META.version) + ' загружена <button id="apply">Показать</button>');
    document.getElementById("apply").onclick = () => {
      CUR.feed = fresh; CUR.admin = null; CUR.decisions = null;
      reload("feed"); reload("admin"); hideNote();
    };
  } catch (err) {
    document.getElementById("ld").innerHTML = "Не удалось открыть HR-дайджест.<br>Откройте файл в Microsoft Edge, Google Chrome или Яндекс Браузере и проверьте подключение к интернету.";
  }
})();
</script>
</body>
